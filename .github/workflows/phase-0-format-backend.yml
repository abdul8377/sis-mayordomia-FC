name: Phase 0 · Format backend

on:
  push:
    branches:
      - chore/phase-0-stabilization

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format backend with Pint')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/phase-0-stabilization

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format backend with Pint
        working-directory: backend
        run: vendor/bin/pint

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format backend with Pint"
            git push origin HEAD:chore/phase-0-stabilization
          fi
